<script>
/* ==========================================================
   Bulk Schedule Sender (Grouped by Class Type)
========================================================== */

let bulkMessages = [];
let bulkIndex = 0;
let bulkGroupedData = {};

function initBulkSender(messages) {
    bulkMessages = messages || [];
    bulkIndex = 0;
    renderBulkReview();
}

function renderBulkReview() {
    // 1. Group by classType
    bulkGroupedData = {};
    bulkMessages.forEach(function(msg) {
        // Determine class type from the student data (fallback to 'Regular' if missing)
        // Note: We need to pass classType from the parent, we will do this in Step 3
        var type = msg.classType || "Regular";
        if (!bulkGroupedData[type]) {
            bulkGroupedData[type] = [];
        }
        bulkGroupedData[type].push(msg);
    });

    var totalStudents = bulkMessages.length;
    var typeKeys = Object.keys(bulkGroupedData);

    // 2. Build the HTML
    var html = `
        <div class="studentsPage" style="padding-bottom: 80px;">
            <div class="pageHero">
                <div class="pageTopBar">
                    <span class="material-icons pointer" onclick="parent.closeBulkSender()">arrow_back</span>
                    <div class="pageTitle">Bulk Schedule</div>
                </div>
                <div class="pageHeading">📅 Bulk Schedule Review</div>
                <div class="pageSubHeading">${totalStudents} students queued for ${parent.getMonthName(bulkMessages[0]?.month || 0)}</div>
            </div>

            <div class="pageContent pagePadding">
                <!-- Summary Card -->
                <div class="actionCard" style="background:#F8FAFC; border:1px solid #E5E7EB; margin-bottom:20px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0;">
                        <span style="color:#6B7280; font-weight:500;">Total Students</span>
                        <span style="font-weight:700; color:#111827;">${totalStudents}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-top:1px solid #E5E7EB; margin-top:8px; padding-top:8px;">
                        <span style="color:#6B7280; font-weight:500;">Class Types</span>
                        <span style="font-weight:700; color:#111827;">${typeKeys.length}</span>
                    </div>
                </div>

                <!-- Grouped by Class Type Sections -->
                ${typeKeys.map(function(type) {
                    var students = bulkGroupedData[type];
                    return `
                        <div style="margin-bottom: 24px;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                                <div style="font-size:16px; font-weight:700; color:#2563EB;">${type}</div>
                                <div style="font-size:12px; color:#6B7280;">${students.length} Student${students.length > 1 ? 's' : ''}</div>
                            </div>
                            ${students.map(function(student, idx) {
                                return `
                                    <div class="actionCard" style="cursor:pointer; margin-bottom:8px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center;" onclick="parent.editBulkStudent(${bulkMessages.indexOf(student)})">
                                        <div>
                                            <div style="font-size:15px; font-weight:700;">${student.studentName}</div>
                                            <div style="font-size:13px; color:#6B7280; margin-top:2px;">
                                                ${student.parentName} • ${student.time}
                                            </div>
                                        </div>
                                        <span class="material-icons" style="color:#9CA3AF;">chevron_right</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                }).join('')}

                <!-- Action Buttons -->
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button class="secondaryButton" style="flex:1;" onclick="parent.closeBulkSender()">Cancel</button>
                    <button class="primaryButton" style="flex:1.2; background:#16A34A;" onclick="openBulkDispatchQueue()">Open Bulk Queue 🚀</button>
                </div>
            </div>
        </div>
    `;

    // Send the HTML to the parent app to render
    parent.render(html);
    parent.bottomNavigation("more");
}

/* ==========================================================
   Bulk Dispatch Queue (The Clipboard Helper)
========================================================== */

function openBulkDispatchQueue() {
    bulkIndex = 0;
    renderDispatchQueue();
}

function renderDispatchQueue() {
    var current = bulkMessages[bulkIndex];
    if (!current) {
        // End of queue
        parent.showNotification("All messages dispatched!", "success");
        parent.renderBulkSender();
        return;
    }

    var total = bulkMessages.length;
    var message = current.message || "Message not generated.";

    var html = `
        <div class="studentsPage">
            <div class="pageHero" style="background:#F8FAFC;">
                <div class="pageTopBar">
                    <div class="pageTitle">Dispatch Queue</div>
                    <span class="material-icons pointer" onclick="closeDispatchQueue()">close</span>
                </div>
                <div class="pageHeading">Sending to ${current.studentName}</div>
                <div class="pageSubHeading">${bulkIndex + 1} of ${total}</div>
            </div>

            <div class="pageContent pagePadding" style="text-align:center;">
                
                <div class="actionCard" style="text-align:left; margin-bottom:20px; border: 2px dashed #2563EB; background:#EFF6FF;">
                    <div style="font-size:12px; font-weight:700; color:#2563EB; text-transform:uppercase; margin-bottom:4px;">📋 Message Preview</div>
                    <pre style="white-space:pre-wrap; font-family:inherit; font-size:14px; color:#1E293B; margin:0; line-height:1.6;">${message}</pre>
                    <div style="margin-top:12px; display:flex; gap:8px;">
                        <button class="primaryButton" style="flex:1; background:#16A34A; font-size:14px;" onclick="copyToClipboard('${encodeURIComponent(message)}')">
                            📋 Copy Message
                        </button>
                    </div>
                </div>

                <div style="display:flex; flex-direction:column; gap:12px;">
                    <button class="primaryButton" style="width:100%; background:#2563EB;" onclick="nextInQueue()">
                        ➡️ Next Student (${bulkIndex + 1}/${total})
                    </button>
                    
                    <div style="display:flex; justify-content:center; gap:8px; font-size:12px; color:#6B7280; margin-top:4px;">
                        <span>Phone: ${current.phone || 'N/A'}</span>
                    </div>
                </div>

            </div>
        </div>
    `;

    parent.render(html);
    parent.bottomNavigation("more");
}

function closeDispatchQueue() {
    renderBulkReview();
}

function nextInQueue() {
    bulkIndex++;
    renderDispatchQueue();
}

function copyToClipboard(encodedMessage) {
    var text = decodeURIComponent(encodedMessage);
    if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function() {
            parent.showNotification("Message copied to clipboard!", "success");
        });
    } else {
        // Fallback for older browsers/WebView
        var tempInput = document.createElement("input");
        tempInput.value = text;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand("copy");
        document.body.removeChild(tempInput);
        parent.showNotification("Message copied to clipboard!", "success");
    }
}

</script>
