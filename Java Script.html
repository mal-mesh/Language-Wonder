========================================================== */

function startAttendance() {
    todayAttendance();
}

function attendance() {
    const now = new Date();
    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const todayStr = `${day}/${month}/${now.getFullYear()}`; 
    const weekdayName = now.toLocaleDateString("en-US", { weekday: "long" });

    render(`
        <div class="studentsPage">
            <div class="pageHero">
                <div class="pageTopBar">
                    <span class="material-icons" onclick="home()">arrow_back</span>
                    <div class="pageTitle">Attendance</div>
                    <span class="material-icons">fact_check</span>
                </div>
                <div class="pageHeading">Manage Sessions</div>
            </div>

            <div class="pageContent pagePadding">
                <div id="todayAttendanceCard" class="actionCard" style="background:#F59E0B; color:white; margin-bottom:15px; cursor:pointer;" onclick="startAttendance()">
                    <div class="actionCardCenter">
                        <div id="todayAttendanceTitle" class="actionTitle" style="color:white;">Today's Attendance</div>
                        <div id="todayAttendanceSubtitle" class="actionSubtitle" style="color:#e0e0e0;">Calculating status...</div>
                    </div>
                    <span id="todayAttendanceIcon" class="material-icons">play_circle_filled</span>
                </div>
            </div>
        </div>
    `);

    bottomNavigation("attendance");

    google.script.run.withSuccessHandler(function(batchData) {
        App.batches = batchData || [];
        
        google.script.run.withSuccessHandler(function(studentData) {
            App.students = studentData || [];

            google.script.run.withSuccessHandler(function(attendanceRecords) {
                const card = document.getElementById("todayAttendanceCard");
                const title = document.getElementById("todayAttendanceTitle");
                const subtitle = document.getElementById("todayAttendanceSubtitle");
                const icon = document.getElementById("todayAttendanceIcon");

                const todayBatches = (App.batches || []).filter(function(b) {
                    return b.days && b.days.includes(weekdayName);
                });

                let totalExpectedStudents = 0;
                todayBatches.forEach(function(batch) {
                    const batchStudents = (App.students || []).filter(s => s.batchId === batch.batchId);
                    totalExpectedStudents += batchStudents.length;
                });

                const loggedRecordsToday = (attendanceRecords || []).filter(function(row) {
                    return row.date === todayStr;
                });

                const uniqueLoggedStudents = new Set(loggedRecordsToday.map(r => r.studentId)).size;
                const pendingCount = totalExpectedStudents - uniqueLoggedStudents;

                if (totalExpectedStudents === 0) {
                    if(card) card.style.background = "#6B7280"; 
                    if(title) title.innerText = "No Classes Today";
                    if(subtitle) subtitle.innerText = "No batches are scheduled for today";
                    if(icon) icon.innerText = "block";
                } else if (pendingCount > 0) {
                    if(card) card.style.background = "#F59E0B"; 
                    if(title) title.innerText = "Today's Attendance";
                    if(subtitle) subtitle.innerText = pendingCount === totalExpectedStudents 
                        ? `Pending • Tap to mark (${totalExpectedStudents} students)`
                        : `${pendingCount} Student${pendingCount > 1 ? 's' : ''} Pending • Tap to complete`;
                    if(icon) icon.innerText = "play_circle_filled";
                } else {
                    if(card) card.style.background = "#16A34A"; 
                    if(title) title.innerText = "Attendance Completed";
                    if(subtitle) subtitle.innerText = `All batches marked • ${uniqueLoggedStudents}/${totalExpectedStudents} students logged`;
                    if(icon) icon.innerText = "check_circle";
                }
            }).getTodayAttendance();

        }).getStudents();

    }).getBatches();
}

function saveAttendance() {
    if (App.requestInProgress) return;

    const checkboxes = document.querySelectorAll(".attendance-checkbox");
    if (checkboxes.length === 0) {
        showNotification("No students found.", "warning");
        return;
    }

    const today = new Date().toLocaleDateString("en-GB"); 
    const records = [];

    checkboxes.forEach(function(cb) {
        const studentId = cb.getAttribute("data-id");
        const student = App.students.find(s => String(s.studentId) === String(studentId));
        
        if (student) {
            records.push({
                date: today,
                studentId: student.studentId,
                studentName: student.studentName,
                batchName: getBatchName(student.batchId),
                time: `${student.classFromTime} - ${student.classToTime}`,
                status: cb.checked ? "Present" : "Absent",
                remarks: cb.checked ? "" : "Absent Bulk Log",
                markedBy: "Teacher"
            });
        }
    });

    App.requestInProgress = true;
    showNotification("Saving batch attendance...", "info");

    let savedCount = 0;
    records.forEach(function(singleRecord) {
        google.script.run
            .withSuccessHandler(function() {
                savedCount++;
                if (savedCount === records.length) {
                    App.requestInProgress = false;
                    showNotification("Attendance saved successfully!", "success");
                    setTimeout(function() { attendance(); }, 1200);
                }
            })
            .withFailureHandler(function() {
                App.requestInProgress = false;
                showNotification("Error saving some records.", "error");
            })
            .saveAttendance(singleRecord); 
    });
}

function renderStudentAttendanceMatrix(studentId, attendanceHistory) {
    const container = document.getElementById("attendanceHeatmapContainer");
    const summaryEl = document.getElementById("attendanceStatsSummary");
    if (!container) return;

    // Generate last 28 days array
    const days = [];
    const today = new Date();
    for (let i = 27; i >= 0; i--) {
        const d = new Date();
        d.setDate(today.getDate() - i);
        days.push(d);
    }

    // Map history to lookup map
    const historyMap = {};
    attendanceHistory.forEach(record => {
        // Normalizing date strings (YYYY-MM-DD or DD/MM/YYYY)
        let formattedDate = record.date;
        if (record.date.includes('/')) {
            const parts = record.date.split('/');
            if (parts.length === 3) {
                formattedDate = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
            }
        }
        historyMap[formattedDate] = record;
    });

    let presentCount = 0;
    let absentCount = 0;

    let gridHtml = '<div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;">';

    days.forEach(day => {
        const isoDate = day.toISOString().split('T')[0];
        const record = historyMap[isoDate];
        const dayNum = day.getDate();
        const dayLabel = day.toLocaleDateString('en-US', { weekday: 'narrow' });

        let bgColor = "#E2E8F0"; // No class logged
        let textColor = "#64748B";
        let tooltip = `${day.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}: No Class`;

        if (record) {
            if (record.status === 'Present') {
                bgColor = "#10B981"; // Green
                textColor = "#FFFFFF";
                presentCount++;
                tooltip = `${day.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}: Present ✓`;
            } else if (record.status === 'Absent') {
                bgColor = "#EF4444"; // Red
                textColor = "#FFFFFF";
                absentCount++;
                const reason = record.remarks ? ` (${record.remarks})` : '';
                tooltip = `${day.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}: Absent ✕${reason}`;
            }
        }

        gridHtml += `
            <div title="${tooltip}" style="background: ${bgColor}; color: ${textColor}; border-radius: 10px; height: 38px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; transition: transform 0.15s ease;">
                <span style="font-size: 9px; opacity: 0.8; line-height: 1;">${dayLabel}</span>
                <span style="margin-top: 1px;">${dayNum}</span>
            </div>
        `;
    });

    gridHtml += '</div>';

    // Legend
    gridHtml += `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 10px; border-top: 1px solid #E2E8F0; font-size: 11px; font-weight: 600; color: #64748B;">
            <div style="display: flex; gap: 12px;">
                <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #10B981;"></span> Present</span>
                <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #EF4444;"></span> Absent</span>
                <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #E2E8F0;"></span> Off</span>
            </div>
        </div>
    `;

    container.innerHTML = gridHtml;

    if (summaryEl) {
        const totalLogged = presentCount + absentCount;
        const rate = totalLogged > 0 ? Math.round((presentCount / totalLogged) * 100) : 100;
        summaryEl.innerHTML = `${rate}% Attendance (${presentCount}/${totalLogged})`;
    }
}

function saveCurrentStudent(){
    if(!App.currentEditStudentId){
        showNotification("Missing student key.","error");
        return;
    }
    if (App.requestInProgress) return;

    const studentId = App.currentEditStudentId;
    const existing = (App.students || []).find(s => String(s.studentId) === String(studentId));
    if (!existing) {
        showNotification("Student not found.", "error");
        return;
    }

    const formData = getStudentFormData();
    const validation = validateStudent(formData);
    if (!validation.valid) {
        showNotification(validation.message, "warning");
        return;
    }

    const newStatus = document.getElementById("accountStatus")?.value || "Active";
    const student = Object.assign({}, existing, formData, {
        status: newStatus,
        // Clear out any old reason once the student is set back to Active;
        // otherwise keep whatever reason was already on record.
        inactiveReason: newStatus === "Inactive" ? (existing.inactiveReason || "") : ""
    });

    // 1. Optimistic local update
    Object.assign(existing, student);
    CacheEngine.save(CacheEngine.KEYS.STUDENTS, App.students);

function getStudentFormData(){
    return {
        studentName: (document.getElementById("studentName")?.value || "").trim(),
        parentName: (document.getElementById("parentName")?.value || "").trim(),
        whatsapp: (document.getElementById("whatsapp")?.value || "").trim(),
        classType: document.getElementById("classType")?.value || "",    
        batchId: document.getElementById("batch")?.value || "",
        classFromTime: (document.getElementById("fromTime")?.value || "").trim(),
        classToTime: (document.getElementById("toTime")?.value || "").trim(),
        expectedFee: (document.getElementById("expectedFee")?.value || "").trim(),
        paidUntil: (document.getElementById("paidUntil")?.value || "").trim()
    };
}

function validateStudent(student){
    if(!student.studentName) return { valid:false, message:"Missing Student Name." };
    if(!student.parentName) return { valid:false, message:"Missing Parent Name." };
    if(!student.whatsapp) return { valid:false, message:"Missing WhatsApp Number." };
    if(!student.classType) return { valid:false, message:"Select a Class Type." };
    if(!student.batchId) return { valid:false, message:"Select a Batch." }; 
    if(!student.classFromTime) return { valid:false, message:"Select From Time." };
    if(!student.classToTime) return { valid:false, message:"Select To Time." };
    return { valid:true };
}

function saveStudent(){
    if(App.requestInProgress) return;
    const student = getStudentFormData();
    const validation = validateStudent(student);

    if(!validation.valid){
        showNotification(validation.message, "warning");
        return;
    }
    
    // Optimistic Insertion
    student.studentId = "ST-" + Date.now();
    App.students.push(student);
    CacheEngine.save(CacheEngine.KEYS.STUDENTS, App.students);

    showNotification("Student added ✓", "success");
    setTimeout(() => { screen("students"); }, 300);

    // Silent Async Backend Sync
    google.script.run
        .withSuccessHandler(function(serverStudentId){
            student.studentId = serverStudentId;
            CacheEngine.save(CacheEngine.KEYS.STUDENTS, App.students);
        })
        .withFailureHandler(function(){
            showNotification("Failed to write record to spreadsheet.", "error");
        })
        .saveStudent(student);
}

        setTimeout(function () {

function generateClassDates() {

    const batchId = App.communication?.batchId;
    const month = Number(App.communication?.month);

    // DEFAULT SAFETY: If no batch is selected (Bulk mode), we set a fallback
    let weekdayNumbers = [0, 1, 2, 3, 4, 5, 6]; // All days of the week

    if (batchId) {
        const batch = (App.batches || batchesData).find(function(item) {
            return String(item.batchId) === String(batchId);
        });
        if (batch) {
            weekdayNumbers = getWeekdayNumbers(batch.days);
        } else {
            return showNotification("Batch not found.", "error");
        }
    }

    // Ensure year is always the current year if missing
    if (!App.communication.year) {
        App.communication.year = new Date().getFullYear();
    }

    App.communication.dates = generateDates(
        App.communication.year,
        month,
        weekdayNumbers
    );

    App.communication.selectedDates = App.communication.dates.slice(0, 8);

    // Now generate the actual messages with the dates we just created
    generateMessages();

    if (App.communication.messages.length === 0) {
        return showNotification("No students found in this batch.", "warning");
    }

    reviewSchedule();
}

function generateMessages(){
    App.communication.messages = [];
    const batchId = App.communication.batchId;
    const batchName = App.communication.batch;
    const students = App.students.filter(student => student.batchId === batchId);

    students.forEach(function(student){
        const message = {
            studentId: student.studentId,
            studentName: student.studentName,
            parentName: student.parentName,
            phone: student.whatsapp,
            batch: batchName,
            time: student.classFromTime + " - " + student.classToTime,
            customDates: [...App.communication.selectedDates],
            adjustment: "None",
            isAdjusted: false
        };
        updateRecipientMessage(message);
        App.communication.messages.push(message);
    });
}

function updateRecipientMessage(student) {
    let msg = App.communication.template || "Hello Mrs. {{parentName}},\n\nHere is {{studentName}}'s schedule for {{month}} {{year}}.\n\n📅 Class Dates: {{dates}}\n\nBatch: {{batchName}}\n🕒 Time: {{time}}\n\n{{note}}Merci,\nLanguage Wonder";
    
    let noteText = "";
    if (student.adjustment && student.adjustment !== "None" && student.adjustment.trim() !== "") {
        noteText = `📌 Note:\n${student.adjustment}\n\n`;
    }

    msg = msg.replace(/{{parentName}}/g, student.parentName || "");
    msg = msg.replace(/{{studentName}}/g, student.studentName || "");
    msg = msg.replace(/{{month}}/g, getMonthName(App.communication.month));
    msg = msg.replace(/{{year}}/g, App.communication.year);
    msg = msg.replace(/{{dates}}/g, student.customDates.join(", "));
    msg = msg.replace(/{{batchName}}/g, App.communication.batch || "");
    msg = msg.replace(/{{time}}/g, student.time || "");
    msg = msg.replace(/{{note}}/g, noteText);
    
    student.message = msg;
}

function getMonthName(month){
    // Since we are passing 1-12 (January = 1, December = 12), we subtract 1 for the array index
    return ["January","February","March","April","May","June","July","August","September","October","November","December"][month - 1] || "";
}

function getWeekdayNumbers(days){
    if(!days) return [];
    const map = { "Sunday":0, "Monday":1, "Tuesday":2, "Wednesday":3, "Thursday":4, "Friday":5, "Saturday":6 };
    const daysArr = Array.isArray(days) ? days : days.split(",");
    return daysArr.map(day => map[day.trim()]).filter(day => day !== undefined);
}

function generateDates(year, month, weekdayNumbers){
    const dates = [];
    const totalDays = new Date(year, month + 1, 0).getDate();
    for(let day = 1; day <= totalDays; day++){
        const date = new Date(year, month, day);
        if(weekdayNumbers.includes(date.getDay())) dates.push(day);
    }
    return dates;
}

function setStudentFilter(filterType) {
    // If the filter is already active, turn it OFF (go back to ALL)
    if (currentStudentFilter === filterType) {
        currentStudentFilter = "ALL";
    } else {
        currentStudentFilter = filterType;
    }

    // Update active UI state on chips
    document.querySelectorAll("[id^='filterChip-']").forEach(chip => {
        chip.classList.remove("selected");
    });
    const activeChip = document.getElementById(`filterChip-${currentStudentFilter}`);
    if (activeChip) activeChip.classList.add("selected");

    // Run the filter with the new state
    filterStudents(currentStudentFilter);
}

function filterStudents(filterType) {
    // If the chip didn't pass the filterType, use the current state as fallback
    const activeFilter = filterType || currentStudentFilter || "ALL";
    const query = (document.getElementById("studentSearch")?.value || "").trim().toLowerCase();
    
    const fullList = App.students || [];
    
    const filtered = fullList.filter(student => {
        // Text Match
        const matchesQuery = student.studentName.toLowerCase().includes(query) ||
                             student.classType.toLowerCase().includes(query) ||
                             String(student.studentId).toLowerCase().includes(query);

        // Chip Match
        let matchesChip = true;
        const status = getPaymentStatus(student.paidUntil);
        
        // RUGGED NORMALIZATION: Crush all invisible spaces into a single regular space
        const normalizedType = (student.classType || "")
                                    .toLowerCase()
                                    .trim()
                                    .replace(/\s+/g, ' '); 
        
        if (activeFilter === "PENDING") {
            matchesChip = status.label.toLowerCase().includes("pending");
        } else if (activeFilter === "PRIVATE") {
            matchesChip = normalizedType === "private class";
        } else if (activeFilter === "GROUP") {
            matchesChip = normalizedType === "group class";
        } else if (activeFilter === "INACTIVE") {
            matchesChip = student.status === "Inactive";
        }

        return matchesQuery && matchesChip;
    });

    // FORCE A HARD RE-RENDER BY CLEARING THE CONTAINER FIRST
    const container = document.getElementById("studentList");
    if (container) {
        container.innerHTML = ''; // Blow away the old list
    }

    loadStudentCards(filtered);
}

function toggleStudentDate(studentIndex, date) {
    const student = App.communication.messages[studentIndex];
    const idx = student.customDates.indexOf(date);

    if (idx > -1) {
        student.customDates.splice(idx, 1);
    } else {
        student.customDates.push(date);
    }

    student.customDates.sort((a, b) => a - b);
    
    const extraDates = student.customDates.filter(d => !App.communication.dates.includes(d));
    
    if (extraDates.length > 0) {
        const dateText = extraDates.join(", ");
        const word = extraDates.length > 1 ? "Classes" : "Class";
        student.adjustment = `${word} on ${dateText} scheduled as requested.`;
    } else {
        student.adjustment = "None";
    }

    updateRecipientMessage(student);
    editStudentSchedule(studentIndex);
}

    // 2. Format the template message
    let message = App.communication.receiptTemplate
        .replace("{{parentName}}", paymentData.parentName || "Parent")
        .replace("{{studentName}}", paymentData.studentName || "Student")
        .replace("{{amount}}", paymentData.amount || "0")
        .replace("{{paymentDate}}", paymentData.date || "")
        .replace("{{paymentMode}}", paymentData.mode || "Online")
        .replace("{{notes}}", paymentData.notes || "N/A");

    // 3. Encode message for URL safety
    const encodedMsg = encodeURIComponent(message);

    // 4. Open WhatsApp Web or Mobile App
    if (phone) {
        window.open(`https://wa.me/${phone}?text=${encodedMsg}`, '_blank');
    } else {

        window.open(`https://wa.me/?text=${encodedMsg}`, '_blank');
    }
}

function monthlySenderLoadStudents(mode, month, batch){

    google.script.run
    .withSuccessHandler(function(students){

        google.script.run
        .withSuccessHandler(function(batchDays){

            let filtered = students;

            if(mode === "batch"){
                filtered = students.filter(function(student){
                    return student.batchId === batch;
                });
            }

            App.communication.messages = [];
            
            // Determine the selected dates based on the month
            var selectedDates = App.communication.dates.slice(0, 8); // Take first 8 dates as default
            App.communication.selectedDates = selectedDates;

            filtered.forEach(function(student){
                const daysString = batchDays[student.batchId] || "";
                const wantedDays = daysString
                    .split(",")
                    .map(function(day){
                        return day.trim();
                    })
                    .filter(Boolean);

                const dates = [];
                const year = App.communication.year;
                
                // CORRECT LOGIC: JavaScript months are 0-indexed.
                // If month = 8 (August), we want the last day of August.
                // new Date(year, month + 1, 0) = new Date(year, 9, 0) = Last day of August.
                const lastDay = new Date(year, month + 1, 0).getDate(); 

                for(let d = 1; d <= lastDay; d++){
                    // FIX: We must subtract 1 from month to get the 0-indexed month.
                    // If month = 8, 8 - 1 = 7 (which is August in JS).
                    const date = new Date(year, month - 1, d); 
                    const weekday = date.toLocaleDateString(
                        "en-US",
                        { weekday:"long" }
                    );
                    if(wantedDays.includes(weekday)){
                        dates.push(d);
                    }
                }

                const message = {
                    studentId: student.studentId,
                    studentName: student.studentName,
                    parentName: student.parentName,
                    phone: student.whatsapp,
                    batchId: student.batchId,
                    batch: student.batchName || student.batch,
                    time: student.classFromTime + " - " + student.classToTime,
                    customDates: dates.slice(0, 8),
                    addedDates: [],
                    adjustment: "None",
                    isAdjusted: false
                };

                updateRecipientMessage(message);
                App.communication.messages.push(message);
            });
            reviewSchedule();
        })
        .getAllBatchDays();

    })
    .getStudents();
}

/* ==========================================================
   Touch Event Handlers for Swipe-to-Action
========================================================== */

function handleTouchStart(e) {
    var touch = e.touches[0];
    if (!touch) return;
    e.currentTarget._startX = touch.clientX;
    e.currentTarget._isSwiping = true;
}

function handleTouchMove(e, elementId) {
    var el = document.getElementById(elementId);
    if (!el || !el._isSwiping) return;
    
    var touch = e.touches[0];
    if (!touch) return;
    
    var deltaX = touch.clientX - el._startX;
    
    // Limit drag to prevent excessive movement
    var limitedX = Math.max(-120, Math.min(120, deltaX));
    el.style.transform = 'translateX(' + limitedX + 'px)';
}

function handleTouchEnd(e, elementId, studentId, studentName) {
    var el = document.getElementById(elementId);
    if (!el) {
        console.log("Element not found:", elementId);
        return;
    }
    
    el._isSwiping = false;
    var transform = el.style.transform || 'translateX(0px)';
    var match = transform.match(/translateX\((-?\d+)px\)/);
    var deltaX = match ? parseInt(match[1]) : 0;
    
    console.log("Swipe deltaX:", deltaX);
    
    var threshold = 80;
    
    if (deltaX > threshold) {
        console.log("Swipe RIGHT - Present for:", studentId, studentName);
        el.style.transform = 'translateX(100%)';
        setTimeout(function() {
            closePopup();
            quickAttendanceState.studentId = studentId;
            quickAttendanceState.studentName = studentName;
            quickAttendanceState.status = "Present";
            quickAttendanceState.reason = "";
            quickAttendanceState.reasonNote = "";
            quickAttendanceState.step = 1;
            submitQuickAttendance();
        }, 300);
    } else if (deltaX < -threshold) {
        console.log("Swipe LEFT - Absent for:", studentId, studentName);
        el.style.transform = 'translateX(-100%)';
        setTimeout(function() {
            console.log("Opening absent modal...");
            closePopup();
            quickAttendanceState.studentId = studentId;
            quickAttendanceState.studentName = studentName;
            quickAttendanceState.status = "Absent";
            quickAttendanceState.reason = "";
            quickAttendanceState.reasonNote = "";
            quickAttendanceState.step = 2;
            
            console.log("quickAttendanceState:", quickAttendanceState);
            renderQuickAttendanceModal();
            console.log("renderQuickAttendanceModal called");
        }, 300);
    } else {
        console.log("Swipe not enough - snapping back");
        el.style.transform = 'translateX(0px)';
    }
}


function attachSwipeListeners(cardElement, studentId, studentName) {
    if (!cardElement) return;
    
    var startX = 0;
    var currentX = 0;
    var isSwiping = false;
    var threshold = 110;
    
    var bgLayer = cardElement.parentElement ? cardElement.parentElement.querySelector('.swipe-background') : null;
    
    cardElement.addEventListener('touchstart', function(e) {
        var touch = e.touches[0];
        if (!touch) return;
        startX = touch.clientX;
        isSwiping = true;
        cardElement.classList.add('swiping');
    }, { passive: true });
    
    cardElement.addEventListener('touchmove', function(e) {
        if (!isSwiping) return;
        var touch = e.touches[0];
        if (!touch) return;
        currentX = touch.clientX - startX;
        
        cardElement.style.transform = 'translateX(' + currentX + 'px)';
        
        if (currentX > 0) {
            if (bgLayer) {
                bgLayer.className = 'swipe-background swipe-bg-right';
                bgLayer.innerHTML = '<span class="material-icons" style="font-size:28px;">check_circle</span> <span style="margin-left:8px; font-size:14px;">MARK PRESENT</span>';
            }
        } else if (currentX < 0) {
            if (bgLayer) {
                bgLayer.className = 'swipe-background swipe-bg-left';
                bgLayer.innerHTML = '<span style="margin-right:8px; font-size:14px;">MARK ABSENT</span> <span class="material-icons" style="font-size:28px;">cancel</span>';
            }
        }
    }, { passive: true });
    
    cardElement.addEventListener('touchend', function() {
        if (!isSwiping) return;
        isSwiping = false;
        cardElement.classList.remove('swiping');
        
        if (currentX > threshold) {
            cardElement.style.transform = 'translateX(100%)';
            setTimeout(function() {
                quickAttendanceState.studentId = studentId;
                quickAttendanceState.studentName = studentName;
                submitAttendanceAsPresent();
            }, 150);
        } else if (currentX < -threshold) {
            cardElement.style.transform = 'translateX(-100%)';
            setTimeout(function() {
                markQuickAttendance(studentId, studentName);
                goToAbsentReasonStep();
            }, 150);
        } else {
            cardElement.style.transform = 'translateX(0px)';
        }
        currentX = 0;
    });
}

/* ==========================================================
   Mouse Handlers for Desktop Testing
========================================================== */

var mouseSwipeData = {
    startX: 0,
    currentX: 0,
    isDragging: false,
    targetId: null
};

function handleMouseDown(e, elementId) {
    mouseSwipeData.startX = e.clientX;
    mouseSwipeData.isDragging = true;
    mouseSwipeData.targetId = elementId;
    
    var el = document.getElementById(elementId);
    if (el) {
        el.style.transition = 'none';
    }
}

function handleMouseMove(e, elementId) {
    if (!mouseSwipeData.isDragging) return;
    
    var el = document.getElementById(elementId);
    if (!el) return;
    
    var deltaX = e.clientX - mouseSwipeData.startX;
    var limitedX = Math.max(-120, Math.min(120, deltaX));
    el.style.transform = 'translateX(' + limitedX + 'px)';
    mouseSwipeData.currentX = deltaX;
}

function handleMouseUp(e, elementId, studentId, studentName) {
    if (!mouseSwipeData.isDragging) return;
    
    mouseSwipeData.isDragging = false;
    var el = document.getElementById(elementId);
    if (!el) return;
    
    el.style.transition = 'transform 0.3s ease';
    
    var deltaX = mouseSwipeData.currentX;
    var threshold = 80;
    
    if (deltaX > threshold) {
        el.style.transform = 'translateX(100%)';
        setTimeout(function() {
            closePopup();
            quickAttendanceState.studentId = studentId;
            quickAttendanceState.studentName = studentName;
            quickAttendanceState.status = "Present";
            quickAttendanceState.reason = "";
            quickAttendanceState.reasonNote = "";
            quickAttendanceState.step = 1;
            submitQuickAttendance();
        }, 300);
    } else if (deltaX < -threshold) {
        el.style.transform = 'translateX(-100%)';
        setTimeout(function() {
            closePopup();
            quickAttendanceState.studentId = studentId;
            quickAttendanceState.studentName = studentName;
            quickAttendanceState.status = "Absent";
            quickAttendanceState.reason = "";
            quickAttendanceState.reasonNote = "";
            quickAttendanceState.step = 2;
            renderQuickAttendanceModal();
        }, 300);
    } else {
        el.style.transform = 'translateX(0px)';
    }
    
    mouseSwipeData.currentX = 0;
    mouseSwipeData.startX = 0;
    mouseSwipeData.targetId = null;
}

function handleTouchCancel(e, elementId) {
    var el = document.getElementById(elementId);
    if (el) {
        el.style.transition = 'transform 0.3s ease';
        el.style.transform = 'translateX(0px)';
        el._isSwiping = false;
    }
}

    var phone = student.whatsapp.replace(/\D/g, "");
    
    // Build the message

        "Dear {{parentName}},\n\nThis is a gentle reminder that the fee for {{studentName}} is due for {{monthsDue}} month(s): {{dueMonths}}.\n\n📅 Current Paid Until: {{paidUntil}}\n💰 Expected Monthly Fee: ₹{{expectedFee}}\n\nPlease complete the payment at your earliest convenience.\n\nMerci,\nLanguage Wonder";

    var amountDue = student.expectedFee * student.monthsDue;
    
    var message = template
        .replace(/{{parentName}}/g, student.parentName || "Parent")
        .replace(/{{studentName}}/g, student.studentName)
        .replace(/{{monthsDue}}/g, student.monthsDue)
        .replace(/{{dueMonths}}/g, dueMonthsDisplay)
        .replace(/{{paidUntil}}/g, student.paidUntil || "N/A")
        .replace(/{{expectedFee}}/g, student.expectedFee)
        .replace(/{{amountDue}}/g, amountDue);

    if (phone) {
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
        showNotification("Opening WhatsApp...", "info");
    } else {
        // Copy to clipboard as fallback
        navigator.clipboard.writeText(message);
        showNotification("No phone number. Message copied to clipboard!", "info");
    }
}

    if (!updated.trim()) {
        showNotification("Template cannot be empty.", "warning");
        return;
    }
    
    App.communication.feeReminderTemplate = updated;
    
    google.script.run
        .withSuccessHandler(function() {
            showNotification("Fee reminder template saved!", "success");
            feeReminders();
        })
        .withFailureHandler(function() {
            showNotification("Failed to save template.", "error");
        })
        .saveFeeReminderTemplate(updated);
}

function prefetchAdjacentDates(currentIso) {
    // Don't prefetch if no students loaded
    if (App.students.length === 0) return;

    const date = new Date(currentIso);
    
    const tomorrow = new Date(date);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const yesterday = new Date(date);
    yesterday.setDate(yesterday.getDate() - 1);
    
    const tomorrowIso = tomorrow.toISOString().split('T')[0];
    const yesterdayIso = yesterday.toISOString().split('T')[0];
    
    // Skip if already cached
    if (App._dateCache && App._dateCache[tomorrowIso] && App._dateCache[yesterdayIso]) {
        return;
    }

    // Initialize cache if needed
    if (!App._dateCache) App._dateCache = {};

    // Fire and forget - load in background
    setTimeout(function() {
        google.script.run
            .withSuccessHandler(function(data) {
                App._dateCache[tomorrowIso] = {
                    attendance: data.attendance || [],
                    customClasses: data.customClasses || []
                };
            })
            .withFailureHandler(function() { /* silent fail */ })
            .getScheduleDataLight(tomorrowIso);
            
        google.script.run
            .withSuccessHandler(function(data) {
                App._dateCache[yesterdayIso] = {
                    attendance: data.attendance || [],
                    customClasses: data.customClasses || []
                };
            })
            .withFailureHandler(function() { /* silent fail */ })
            .getScheduleDataLight(yesterdayIso);
    }, 500);
}
