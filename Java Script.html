/* ==========================================================
   Smart Caching Engine (localStorage + Delta Sync)
========================================================== */

const CacheEngine = {
    KEYS: {
        STUDENTS: 'lw_cache_students',
        BATCHES: 'lw_cache_batches',
        ATTENDANCE: 'lw_cache_attendance',
        LAST_SYNC: 'lw_cache_last_sync'
    },

    save: function(key, value) {
        try {
            localStorage.setItem(key, JSON.stringify(value));
            localStorage.setItem(this.KEYS.LAST_SYNC, new Date().toISOString());
        } catch (e) {
            console.warn("Local cache quota exceeded or blocked.", e);
        }
    },

    get: function(key) {
        try {
            var data = localStorage.getItem(key);
            return data ? JSON.parse(data) : null;
        } catch (e) {
            return null;
        }
    },

    initAppCache: function() {
        var cachedStudents = this.get(this.KEYS.STUDENTS);
        var cachedBatches = this.get(this.KEYS.BATCHES);

        if (cachedStudents) {
            App.students = cachedStudents;
            studentsData = cachedStudents;
        }
        if (cachedBatches) {
            App.batches = cachedBatches;
            batchesData = cachedBatches;
        }
    },

    syncBackgroundData: function(onComplete) {
        var self = this;
        
        // First, try to fetch students
        google.script.run
            .withSuccessHandler(function(data) {
                if (data && Array.isArray(data)) {
                    App.students = data;
                    studentsData = data;
                    self.save(self.KEYS.STUDENTS, data);
                }
                // Then fetch batches
                google.script.run
                    .withSuccessHandler(function(bData) {
                        if (bData && Array.isArray(bData)) {
                            App.batches = bData;
                            batchesData = bData;
                            self.save(self.KEYS.BATCHES, bData);
                        }
                        if (typeof onComplete === 'function') {
                            onComplete();
                        }
                    })
                    .withFailureHandler(function(err) {
                        console.warn("Failed to sync batches:", err);
                        if (typeof onComplete === 'function') {
                            onComplete();
                        }
                    })
                    .getBatches();
            })
            .withFailureHandler(function(err) {
                console.warn("Failed to sync students:", err);
                // Try to fetch batches anyway
                google.script.run
                    .withSuccessHandler(function(bData) {
                        if (bData && Array.isArray(bData)) {
                            App.batches = bData;
                            batchesData = bData;
                            self.save(self.KEYS.BATCHES, bData);
                        }
                        if (typeof onComplete === 'function') {
                            onComplete();
                        }
                    })
                    .withFailureHandler(function(err2) {
                        console.warn("Failed to sync batches after student failure:", err2);
                        if (typeof onComplete === 'function') {
                            onComplete();
                        }
                    })
                    .getBatches();
            })
            .getStudents();
    }
};  // <-- This closes the CacheEngine object (was missing!)

/* ==========================================================
   Application Engine & Core Router
========================================================== */

window.onload = function(){
    CacheEngine.initAppCache();
    screen("home");
    CacheEngine.syncBackgroundData();
};

function render(html){
    const app = document.getElementById("app");
    if(!app) return;
    
    if(!document.getElementById("pageContainer")){
        app.innerHTML = `
            <div id="pageContainer" class="appContainer"></div>
            <div id="navigationContainer" class="appContainer"></div>
            <div id="floatingMenuContainer"></div>
            <div id="popupContainer" class="popupOverlay"></div>
        `;
        createNavigation();
    }

    const pageContainer = document.getElementById("pageContainer");
    
    // Quick re-trigger for smooth entry animation on every page view
    pageContainer.style.animation = 'none';
    pageContainer.offsetHeight; /* trigger reflow */
    pageContainer.style.animation = null;

    pageContainer.innerHTML = html;
    
    // Only render floating menu if NOT on form pages
    const formPages = ["addStudent", "editStudent"];
    const currentScreen = App.navigationState.screen;
    if (!formPages.includes(currentScreen)) {
        document.getElementById("floatingMenuContainer").innerHTML = floatingActionMenu();
    } else {
        document.getElementById("floatingMenuContainer").innerHTML = "";
    }
}

function createNavigation(){
    const navContainer = document.getElementById("navigationContainer");
    if (!navContainer) return;
    navContainer.innerHTML = `
        <div class="bottomNav">
            <div id="navHome" class="navItem" onclick="screen('home')">
                <span class="material-icons">home</span>
                <div>Home</div>
            </div>
            <div id="navSchedule" class="navItem" onclick="screen('schedule')">
                <span class="material-icons">calendar_month</span>
                <div>Schedule</div>
            </div>
            <div id="fabButton" class="navFab">
                <span id="fabIcon" class="material-icons">add</span>
            </div>
            <div id="navFees" class="navItem" onclick="screen('fees')">
                <span class="material-icons">payments</span>
                <div>Fees</div>
            </div>
            <div id="navMore" class="navItem" onclick="screen('more')">
                <span class="material-icons">menu</span>
                <div>More</div>
            </div>
        </div>
    `;
}

function updateNavigation(active){
    const config = getFABConfig(active);

    document.querySelectorAll(".navItem").forEach(function(item){
        item.classList.remove("active");
    });

    switch(active){
        case "home":
            document.getElementById("navHome")?.classList.add("active");
            break;
        case "schedule":
            document.getElementById("navSchedule")?.classList.add("active");
            break;
        case "fees":
            document.getElementById("navFees")?.classList.add("active");
            break;
        case "more":
        case "students":
        case "studentProfile":
        case "attendance":
        case "todayAttendance":
            document.getElementById("navMore")?.classList.add("active");
            break;
    }

    const fab = document.getElementById("fabButton");
    const icon = document.getElementById("fabIcon");

    if(fab){
        fab.classList.remove("fabCenter", "fabRight", "fabHidden");
        fab.classList.add(config.position);
        fab.setAttribute("onclick", config.onclick || "");
    }

    if(icon){
        icon.innerHTML = config.icon;
    }
}

function animateFAB(currentFab, nextFab){
    const fab = document.getElementById("fabButton");
    const icon = document.getElementById("fabIcon");
    if(!fab || !icon) return;

    const currentPosition = currentFab?.position || "fabCenter";
    const nextPosition = nextFab?.position || "fabCenter";

    if(currentPosition === nextPosition && currentFab?.icon === nextFab?.icon){
        return;
    }

    fab.style.pointerEvents = "none";
    fab.style.transition = "transform .35s ease,left .35s ease,right .35s ease";
    icon.style.transition = "opacity .15s ease, transform .15s ease";
    icon.style.opacity = "0";
    icon.style.transform = "scale(.70)";

    setTimeout(function(){
        fab.classList.remove("fabCenter", "fabRight", "fabHidden");
        fab.classList.add(nextPosition);
    }, 80);

    setTimeout(function(){
        icon.innerHTML = nextFab.icon;
        icon.style.opacity = "1";
        icon.style.transform = "scale(1)";
    }, 180);

    setTimeout(function(){
        fab.style.pointerEvents = "";
    }, 360);
}

function bottomNavigation(active){
    const hideNavPages = ["addStudent", "editStudent"];
    const navContainer = document.getElementById("navigationContainer");
    const navItems = document.querySelectorAll(".navItem");
    
    if (hideNavPages.includes(active)) {
        // Hide nav items and white background
        navItems.forEach(function(item) {
            item.style.display = "none";
        });
        if (navContainer) {
            navContainer.style.background = "transparent";
            navContainer.style.boxShadow = "none";
        }
        const bottomNav = document.querySelector(".bottomNav");
        if (bottomNav) {
            bottomNav.style.background = "transparent";
            bottomNav.style.boxShadow = "none";
        }
        // Make sure FAB is visible
        const fabContainer = document.getElementById("fabButton");
        if (fabContainer) {
            fabContainer.style.display = "flex";
        }
    } else {
        // Show everything normally
        navItems.forEach(function(item) {
            item.style.display = "";
        });
        if (navContainer) {
            navContainer.style.background = "";
            navContainer.style.boxShadow = "";
        }
        const bottomNav = document.querySelector(".bottomNav");
        if (bottomNav) {
            bottomNav.style.background = "";
            bottomNav.style.boxShadow = "";
        }
        updateNavigation(active);
    }
    return "";
}

function getFABConfig(active){
    switch(active){
        case "addStudent":
            return { icon: "save", position: "fabRight", onclick: "saveStudent()" };
        case "students":
            return { icon: "person_add", position: "fabRight", onclick: "screen('addStudent')" };
        case "fees":
            return { icon: "payments", position: "fabRight", onclick: "toggleFeesMenu()" };
        case "studentProfile":
            return { icon: "edit", position: "fabRight", onclick: "editStudent(App.currentStudentId)" };
        case "editStudent":
            return { icon: "done", position: "fabRight", onclick: "saveCurrentStudent()" };
        case "schedule":
            return { icon: "add", position: "fabCenter", onclick: "openAddCustomClassModal()" };
        case "attendance":
            return { icon: "", position: "fabHidden", onclick: "" };
        case "todayAttendance":
            return { icon: "save", position: "fabRight", onclick: "saveAttendance()" };
        default:
            return { icon: "add", position: "fabCenter", onclick: "toggleSpeedDial()" };
    }
}

function screen(name, data){
    navigate(name, data);
}

function navigate(name, data){
    const currentFab = App.navigationState.fab || getFABConfig(App.navigationState.screen);
    const nextFab = getFABConfig(name);
    
    animateFAB(currentFab, nextFab);
    App.navigationState.screen = name;
    App.navigationState.fab = nextFab;

    setTimeout(function(){
        const formPages = ["addStudent", "editStudent"];
        const navContainer = document.getElementById("navigationContainer");
        const navItems = document.querySelectorAll(".navItem");
        
        if (formPages.includes(name)) {
            // Hide nav items and the white background
            navItems.forEach(function(item) {
                item.style.display = "none";
            });
            if (navContainer) {
                navContainer.style.background = "transparent";
                navContainer.style.boxShadow = "none";
            }
            // Make sure FAB is visible
            const fabContainer = document.getElementById("fabButton");
            if (fabContainer) {
                fabContainer.style.display = "flex";
            }
            // Hide the bottom nav background
            const bottomNav = document.querySelector(".bottomNav");
            if (bottomNav) {
                bottomNav.style.background = "transparent";
                bottomNav.style.boxShadow = "none";
            }
        } else {
            // Show everything normally
            navItems.forEach(function(item) {
                item.style.display = "";
            });
            if (navContainer) {
                navContainer.style.background = "";
                navContainer.style.boxShadow = "";
            }
            const bottomNav = document.querySelector(".bottomNav");
            if (bottomNav) {
                bottomNav.style.background = "";
                bottomNav.style.boxShadow = "";
            }
            updateNavigation(name);
        }
        
        switch(name){
            case "home": home(); break;
            case "students": students(); break;
            case "schedule": schedule(); break;
            case "fees": fees(); break;
            case "communication": communication(); break;
            case "reviewSchedule": reviewSchedule(); break;
            case "more": more(); break;
            case "attendance": attendance(); break;
            case "settings": settings(); break;
            case "addStudent": addStudent(); break;
            case "editStudent": editStudentScreen(data); break;
            case "monthlySender": monthlySender(); break;
            default: home();
        }
    }, 280);
}

/* ==========================================================
   Speed Dial Components
========================================================== */

function floatingActionMenu(){
    const actions = [
        { icon : "person_add", label : "Add Student", screen : "addStudent", position : "top" },
        { icon : "fact_check", label : "Attendance", screen : "attendance", position : "left" },
        { icon : "payments", label : "Payment", screen : "fees", position : "right" }
    ];

    let html = `
        <div id="speedDialOverlay" class="speedDialOverlay" onclick="closeSpeedDial()">
            <div id="speedDialMenu" class="speedDialMenu" onclick="event.stopPropagation()">
    `;

    actions.forEach(function(action){
        html += floatingActionItem(action);
    });

    html += `
            </div>
        </div>
    `;
    return html;
}

function floatingActionItem(action){
    return `
        <div class="speedDialItem speedDial${capitalize(action.position)}" onclick="closeSpeedDial(); screen('${action.screen}');">
            <button class="speedDialAction">
                <span class="material-icons">${action.icon}</span>
            </button>
            <div class="speedDialText">${action.label}</div>
        </div>
    `;
}

function capitalize(text){
    return text.charAt(0).toUpperCase() + text.slice(1);
}

                    <span class="material-icons pointer" onclick="screen('home')">arrow_back</span>

                    <span class="material-icons" style="color: transparent; pointer-events: none; visibility: hidden;">person_add</span>

                <div class="searchContainer" style="margin-top: 12px;">
                    <span class="material-icons">search</span>
                    <input id="studentSearch" class="searchInput" type="text" placeholder="Search students, batches..." onkeyup="filterStudents()">
                </div>

                               <!-- Smart Filter Chips -->
                <div style="display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 4px 0; no-scrollbar;">
                    <div id="filterChip-ALL" class="filterChip ${currentStudentFilter === 'ALL' ? 'selected' : ''}" 
                         onclick="setStudentFilter('ALL')">All (${App.students.length})</div>
                    
                    <div id="filterChip-PENDING" class="filterChip ${currentStudentFilter === 'PENDING' ? 'selected' : ''}" 
                         onclick="setStudentFilter('PENDING')">
                         <span class="material-icons" style="color:#F59E0B; font-size:14px;">warning</span> Fee Pending
                    </div>
                    
                    <div id="filterChip-PRIVATE" class="filterChip ${currentStudentFilter === 'PRIVATE' ? 'selected' : ''}" 
                         onclick="setStudentFilter('PRIVATE')">
                         <span class="material-icons" style="font-size:14px;">person</span> Private
                    </div>
                    
                    <div id="filterChip-GROUP" class="filterChip ${currentStudentFilter === 'GROUP' ? 'selected' : ''}" 
                         onclick="setStudentFilter('GROUP')">
                         <span class="material-icons" style="font-size:14px;">people</span> Group
                    </div>

                    <div id="filterChip-INACTIVE" class="filterChip ${currentStudentFilter === 'INACTIVE' ? 'selected' : ''}" 
                         onclick="setStudentFilter('INACTIVE')">
                         <span class="material-icons" style="font-size:14px; color:#6B7280;">visibility_off</span> Inactive
                    </div>
                </div>

            <div class="pageContent" style="padding-top: 16px;">
                <div id="studentList">Loading directory...</div>
            </div>
        </div>
    `);

    bottomNavigation("students");

    // Fast-path local render
    if (App.students && App.students.length > 0) {
        filterStudents();
    }

    google.script.run
        .withSuccessHandler(function(data) {
            studentsData = data || [];
            App.students = data || [];
            CacheEngine.save(CacheEngine.KEYS.STUDENTS, App.students);
            filterStudents();
        })
        .withFailureHandler(function() {
            if (!App.students || App.students.length === 0) {
                document.getElementById("studentList").innerHTML = "Failed to load directory.";
            }
        })
        .getStudents();
}

function studentCard(student) {
    const initials = (student.studentName || "ST").split(" ").map(n => n.charAt(0)).join("").substring(0,2).toUpperCase();
    const status = getPaymentStatus(student.paidUntil);
    
    // TEMPORARY DEBUG: Show the raw classType and status on the card
    const rawType = student.classType || "MISSING";
    const rawStatus = student.status || "Active";
    
    return `
        <div class="studentCardV2" onclick="openStudentById('${student.studentId}')">
            <div class="studentAvatar">${initials}</div>
            <div class="studentDetails">
                <div class="studentName">${student.studentName}</div>
                <div class="studentBadgeGroup">${student.classType || 'Regular'}</div>
            </div>
            <div class="studentRight">
                <div style="color:${status.color}; font-weight:700; font-size:12px;">● ${status.label}</div>
                <div class="studentTime">${student.classFromTime || ''} - ${student.classToTime || ''}</div>
            </div>
            <!-- TEMPORARY DEBUG INFO -->
            <div style="position:absolute; bottom:4px; right:10px; font-size:10px; color:#9CA3AF; opacity:0.7;">
                [${rawType}] [${rawStatus}]
            </div>
        </div>
    `;
}

function loadStudentCards(data){
    const container = document.getElementById("studentList");
    if (!container) return;
    
    if(!Array.isArray(data) || data.length === 0){
        container.innerHTML = `<div class="actionCard" style="text-align:center;">No students found.</div>`;
        return;
    }
    
    // REMOVED THE LINE THAT WAS DESTROYING YOUR MASTER ARRAY:
    // App.students = data;
    // studentsData = data;
    
    container.innerHTML = data.map(function(student){ return studentCard(student); }).join("");
}

function schedule() {
    const selectedDateIso = selectedScheduleDate.toISOString().split('T')[0];

    // Debounce: prevent rapid-fire calls
    if (scheduleDebounceTimer) {
        clearTimeout(scheduleDebounceTimer);
        scheduleDebounceTimer = null;
    }

    // Show loading skeleton immediately
    renderScheduleSkeleton();

    // If we already have students & batches cached, only fetch what changes
    if (App.students.length > 0 && App.batches.length > 0) {
        scheduleDebounceTimer = setTimeout(function() {
            google.script.run
                .withSuccessHandler(function(data) {
                    App.dayAttendance = data.attendance || [];
                    App.customClasses = data.customClasses || [];
                    
                    // Store in date cache
                    if (!App._dateCache) App._dateCache = {};
                    App._dateCache[selectedDateIso] = {
                        attendance: App.dayAttendance,
                        customClasses: App.customClasses
                    };
                    
                    renderScheduleView();
                    
                    // Prefetch adjacent dates in background
                    prefetchAdjacentDates(selectedDateIso);
                })
                .withFailureHandler(function(err) {
                    console.error("Failed to load attendance data:", err);
                    if (App.dayAttendance.length > 0 || App.customClasses.length > 0) {
                        showNotification("Using cached attendance data.", "info");
                        renderScheduleView();
                    } else {
                        showNotification("Unable to load schedule data.", "error");
                        renderScheduleView();
                    }
                })
                .getScheduleDataLight(selectedDateIso);
        }, 150);
        return;
    }

    // First-time load: fetch everything
    scheduleDebounceTimer = setTimeout(function() {
        google.script.run
            .withSuccessHandler(function(data) {
                data = data || {};
                App.batches = data.batches || [];
                batchesData = App.batches;
                CacheEngine.save(CacheEngine.KEYS.BATCHES, App.batches);

                App.students = data.students || [];
                studentsData = App.students;
                CacheEngine.save(CacheEngine.KEYS.STUDENTS, App.students);

                App.dayAttendance = data.attendance || [];
                App.customClasses = data.customClasses || [];

                if (!App._dateCache) App._dateCache = {};
                App._dateCache[selectedDateIso] = {
                    attendance: App.dayAttendance,
                    customClasses: App.customClasses
                };

                renderScheduleView();
                prefetchAdjacentDates(selectedDateIso);
            })
            .withFailureHandler(function(err) {
                console.error("Failed to load schedule data:", err);
                if (App.students.length > 0 && App.batches.length > 0) {
                    showNotification("Using cached student data.", "warning");
                    renderScheduleView();
                } else {
                    showNotification("Unable to load schedule data. Please refresh.", "error");
                }
            })
            .getScheduleData(selectedDateIso);
    }, 150);
}

function changeScheduleMonth(delta) {
    // Clear debounce timer
    if (scheduleDebounceTimer) {
        clearTimeout(scheduleDebounceTimer);
        scheduleDebounceTimer = null;
    }
    
    const newDate = new Date(selectedScheduleDate);
    newDate.setMonth(newDate.getMonth() + delta);
    
    // Keep the same day of month, but clamp to valid range
    const maxDay = new Date(newDate.getFullYear(), newDate.getMonth() + 1, 0).getDate();
    if (newDate.getDate() > maxDay) {
        newDate.setDate(maxDay);
    }
    
    selectedScheduleDate = newDate;
    const isoString = selectedScheduleDate.toISOString().split('T')[0];
    
    // Check cache first
    if (App._dateCache && App._dateCache[isoString]) {
        const cached = App._dateCache[isoString];
        App.dayAttendance = cached.attendance || [];
        App.customClasses = cached.customClasses || [];
        renderScheduleView();
        return;
    }
    
    schedule();
}

function renderScheduleView() {
    const today = new Date();
    const selectedDateIso = selectedScheduleDate.toISOString().split('T')[0];
    const isToday = selectedScheduleDate.toDateString() === today.toDateString();
    
    // --- BUILD MONTH CALENDAR STRIP ---
    const dateStripHtml = buildMonthCalendar(selectedScheduleDate);

    const selectedDayName = selectedScheduleDate.toLocaleDateString('en-US', { weekday: 'long' }).trim().toLowerCase();

    // --- BUILD LOOKUP MAPS ---
    const attendanceMap = {};
    (App.dayAttendance || []).forEach(function(att) {
        const key = String(att.studentId) + '|' + String(att.date || '');
        attendanceMap[key] = att;
    });

    const customClassMap = {};
    (App.customClasses || []).forEach(function(cc) {
        const key = String(cc.StudentId) + '|' + String(cc.Date || '');
        customClassMap[key] = cc;
    });

    // --- PRE-FILTER STUDENTS ---
    const batchIdsForDay = new Set();
    (App.batches || []).forEach(function(batch) {
        const daysStr = (batch.days || '').toLowerCase();
        if (daysStr.includes(selectedDayName)) {
            batchIdsForDay.add(String(batch.batchId));
        }
    });

    // --- BUILD SCHEDULED EVENTS ---
    const scheduledEvents = [];

    // Add regular students
    (App.students || []).forEach(function(student) {
        if (!batchIdsForDay.has(String(student.batchId))) return;
        if (student.status === 'Inactive') return;

        const key = String(student.studentId) + '|' + selectedDateIso;
        const att = attendanceMap[key];
        const customClass = customClassMap[key];
        if (customClass) return;

        scheduledEvents.push({
            studentId: student.studentId,
            studentName: student.studentName,
            parentName: student.parentName || '',
            batchName: getBatchName(student.batchId) || "Class",
            timeFrom: student.classFromTime || "10:00 AM",
            timeTo: student.classToTime || "11:00 AM",
            classType: student.classType || "Regular",
            attendanceStatus: att ? att.status : null,
            attendanceRemarks: att ? att.remarks : "",
            isCustom: false,
            customClassId: null
        });
    });

    // Add custom classes
    (App.customClasses || []).forEach(function(customClass) {
        const classDate = customClass.Date || "";
        if (classDate !== selectedDateIso) return;

        const key = String(customClass.StudentId) + '|' + selectedDateIso;
        const att = attendanceMap[key];

        scheduledEvents.push({
            studentId: customClass.StudentId,
            studentName: (customClass.StudentName || "Student") + " ✨",
            parentName: '',
            batchName: customClass.BatchName || "Custom Class",
            timeFrom: customClass.FromTime || "10:00 AM",
            timeTo: customClass.ToTime || "11:00 AM",
            classType: "Makeup",
            attendanceStatus: att ? att.status : (customClass.AttendanceStatus || null),
            attendanceRemarks: att ? att.remarks : (customClass.AttendanceRemarks || ""),
            isCustom: true,
            customClassId: customClass.ID
        });
    });

    // Sort by time
    scheduledEvents.sort(function(a, b) { 
        return a.timeFrom.localeCompare(b.timeFrom); 
    });

    // --- STATS ---
    const presentCount = scheduledEvents.filter(function(e) { return e.attendanceStatus === 'Present'; }).length;
    const absentCount = scheduledEvents.filter(function(e) { return e.attendanceStatus === 'Absent'; }).length;
    const totalCount = scheduledEvents.length;

    // --- BUILD PREMIUM TIMELINE ---
    let timelineHtml = "";
    if (scheduledEvents.length === 0) {
        timelineHtml = `
            <div style="text-align: center; padding: 60px 20px;">
                <div style="width: 72px; height: 72px; border-radius: 50%; background: #F3F4F6; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
                    <span class="material-icons" style="font-size: 36px; color: #9CA3AF;">event_busy</span>
                </div>
                <div style="font-size: 18px; font-weight: 700; color: #374151;">No Classes Today</div>
                <div style="font-size: 14px; color: #9CA3AF; margin-top: 4px;">${selectedScheduleDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })} is free</div>
                <div style="margin-top: 16px;">
                    <button class="timeChip" style="border-color: #2563EB; color: #2563EB; background: #EFF6FF; padding: 8px 20px; cursor: pointer;" onclick="openAddCustomClassModal()">
                        + Add Class
                    </button>
                </div>
            </div>
        `;
    } else {
        // Group by time slot
        const timeGroups = {};
        scheduledEvents.forEach(function(event) {
            const timeKey = event.timeFrom + ' - ' + event.timeTo;
            if (!timeGroups[timeKey]) timeGroups[timeKey] = [];
            timeGroups[timeKey].push(event);
        });

        timelineHtml = Object.keys(timeGroups).sort().map(function(timeKey) {
            const events = timeGroups[timeKey];
            const firstEvent = events[0];
            const timeDisplay = firstEvent.timeFrom + ' - ' + firstEvent.timeTo;
            
            const eventCards = events.map(function(event) {
                const isAbsent = event.attendanceStatus === 'Absent';
                const isPresent = event.attendanceStatus === 'Present';
                const isCustom = event.isCustom || false;
                
                let statusColor = '#10B981';
                let statusLabel = '';
                let statusBg = '#DCFCE7';
                
                if (isPresent) {
                    statusColor = '#10B981';
                    statusLabel = '✓ Present';
                    statusBg = '#DCFCE7';
                } else if (isAbsent) {
                    statusColor = '#EF4444';
                    statusLabel = '✕ Absent';
                    statusBg = '#FEF2F2';
                } else {
                    statusColor = '#94A3B8';
                    statusLabel = '⏳ Pending';
                    statusBg = '#F1F5F9';
                }
                
                const cardStyle = isCustom ? 'border-left: 4px solid #F59E0B;' : '';
                const nameColor = isAbsent ? '#64748B' : '#0F172A';
                const nameDecoration = isAbsent ? 'line-through' : 'none';
                
                return `
                    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #FFFFFF; border-radius: 12px; border: 1px solid #F1F5F9; ${cardStyle} margin-bottom: 4px; cursor: pointer;" onclick="openScheduleActionSheet('${event.studentId}')">
                        <div style="flex: 1; min-width: 0;">
                            <div style="font-size: 15px; font-weight: 700; color: ${nameColor}; text-decoration: ${nameDecoration};">
                                ${event.studentName}
                                ${isCustom ? '<span style="font-size: 11px; color: #D97706; font-weight: 600; margin-left: 6px;">⭐ Makeup</span>' : ''}
                            </div>
                            <div style="font-size: 12px; color: #94A3B8; margin-top: 2px;">
                                ${event.batchName}
                                ${event.parentName ? '• ' + event.parentName : ''}
                            </div>
                        </div>
                        <div style="text-align: right; flex-shrink: 0;">
                            <span style="display: inline-block; font-size: 11px; font-weight: 700; color: ${statusColor}; background: ${statusBg}; padding: 4px 12px; border-radius: 12px;">
                                ${statusLabel}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div style="margin-bottom: 12px;">
                    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 4px; padding: 0 4px;">
                        <div style="font-size: 13px; font-weight: 700; color: #2563EB; background: #EFF6FF; padding: 4px 14px; border-radius: 20px;">
                            🕐 ${timeDisplay}
                        </div>
                        <div style="flex: 1; height: 1px; background: #E5E7EB;"></div>
                        <div style="font-size: 12px; font-weight: 600; color: #94A3B8;">
                            ${events.length} class${events.length > 1 ? 'es' : ''}
                        </div>
                    </div>
                    ${eventCards}
                </div>
            `;
        }).join('');
    }

    // --- STATS BAR ---
    let statsBar = "";
    if (totalCount > 0) {
        const remaining = totalCount - (presentCount + absentCount);
        statsBar = `
            <div style="display: flex; gap: 16px; background: #F8FAFC; border-radius: 12px; padding: 10px 16px; margin-bottom: 16px; border: 1px solid #F1F5F9;">
                <div style="flex: 1; text-align: center;">
                    <div style="font-size: 18px; font-weight: 800; color: #10B981;">${presentCount}</div>
                    <div style="font-size: 10px; font-weight: 600; color: #94A3B8;">Present</div>
                </div>
                <div style="width: 1px; background: #E5E7EB;"></div>
                <div style="flex: 1; text-align: center;">
                    <div style="font-size: 18px; font-weight: 800; color: #EF4444;">${absentCount}</div>
                    <div style="font-size: 10px; font-weight: 600; color: #94A3B8;">Absent</div>
                </div>
                <div style="width: 1px; background: #E5E7EB;"></div>
                <div style="flex: 1; text-align: center;">
                    <div style="font-size: 18px; font-weight: 800; color: #94A3B8;">${remaining}</div>
                    <div style="font-size: 10px; font-weight: 600; color: #94A3B8;">Pending</div>
                </div>
            </div>
        `;
    }

    // --- RENDER ---
    const html = 
        '<div class="studentsPage" style="padding-bottom: 90px; background: #F8FAFC;">' +
            '<div style="padding: 16px 16px 10px 16px;">' +
                // Month header
                '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">' +
                    '<span class="material-icons pointer" style="color: #4B5563; font-size: 28px;" onclick="changeScheduleMonth(-1)">chevron_left</span>' +
                    '<span style="font-size: 20px; font-weight: 800; color: #0F172A;">' + selectedScheduleDate.toLocaleString('default', { month: 'long', year: 'numeric' }) + '</span>' +
                    '<span class="material-icons pointer" style="color: #4B5563; font-size: 28px;" onclick="changeScheduleMonth(1)">chevron_right</span>' +
                '</div>' +
                // Today button + date
                '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">' +
                    '<span style="font-size: 14px; font-weight: 600; color: #64748B;">' + selectedScheduleDate.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }) + '</span>' +

                '</div>' +
                // Calendar grid
                '<div style="background: #FFFFFF; border-radius: 16px; border: 1px solid #E5E7EB; padding: 8px; margin-bottom: 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;">' +

                    timelineHtml +

            '</div>' +
        '</div>';

    requestAnimationFrame(function() {
        render(html);
        bottomNavigation("schedule");
    });
}

function buildMonthCalendar(selectedDate) {
    const today = new Date();
    const selectedMonth = selectedDate.getMonth();
    const selectedYear = selectedDate.getFullYear();
    
    const firstDay = new Date(selectedYear, selectedMonth, 1);
    const lastDay = new Date(selectedYear, selectedMonth + 1, 0);
    const totalDays = lastDay.getDate();
    const startDayOfWeek = firstDay.getDay();
    
    const dayNames = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
    
    let html = '';
    
    // Day name headers
    dayNames.forEach(function(day) {
        html += '<div style="text-align: center; font-size: 10px; font-weight: 600; color: #94A3B8; padding: 4px 0;">' + day + '</div>';
    });
    
    // Empty cells for days before the 1st
    for (let i = 0; i < startDayOfWeek; i++) {
        html += '<div style="text-align: center; padding: 4px 0;"></div>';
    }
    
    // All days of the month
    for (let day = 1; day <= totalDays; day++) {
        let d = new Date(selectedYear, selectedMonth, day);
        let isSelected = d.toDateString() === selectedDate.toDateString();
        let isTodayDate = d.toDateString() === today.toDateString();
        
        let bgStyle = 'transparent';
        let textStyle = '#334155';
        let borderStyle = 'none';
        let dotHtml = '';
        
        if (isSelected) {
            bgStyle = '#2563EB';
            textStyle = '#FFFFFF';
        } else if (isTodayDate) {
            textStyle = '#2563EB';
            borderStyle = '2px solid #2563EB';
        }
        
        // Check if this day has classes
        let hasClass = false;
        const dayName = d.toLocaleDateString('en-US', { weekday: 'long' }).toLowerCase();
        (App.batches || []).forEach(function(batch) {
            if ((batch.days || '').toLowerCase().includes(dayName)) {
                hasClass = true;
            }
        });
        
        if (hasClass && !isSelected && !isTodayDate) {
            dotHtml = '<div style="width: 4px; height: 4px; border-radius: 50%; background: #2563EB; margin: 1px auto 0;"></div>';
        }
        
        html += '<div onclick="selectScheduleDate(\'' + d.toISOString() + '\')" ' +
            'style="text-align: center; padding: 4px 0; border-radius: 10px; cursor: pointer; transition: all 0.15s ease; ' +
            'background: ' + bgStyle + '; color: ' + textStyle + '; border: ' + borderStyle + '; min-height: 36px; display: flex; flex-direction: column; justify-content: center; align-items: center;">' +
            '<div style="font-size: 14px; font-weight: ' + (isSelected ? '700' : '500') + ';">' + day + '</div>' +
            dotHtml +
            '</div>';
    }
    
    return html;
}

function triggerRescheduleForStudent(studentId) {
    // Save the student ID into the global state
    customEventState.studentId = studentId;
    customEventState.type = "reschedule";
    
    // Reset temp values for a fresh start
    tempRescheduleFromTime = "";
    tempRescheduleToTime = "";
    
    // Find the student
    const student = App.students.find(s => String(s.studentId) === String(studentId));
    if (!student) {
        showNotification("Student not found.", "error");
        return;
    }
    
    // Pre-fill the student's current times
    tempRescheduleFromTime = student.classFromTime || "";
    tempRescheduleToTime = student.classToTime || "";
    
    // Open the modal
    openAddCustomClassModal();
    
    // Wait for the modal to render, then pre-fill the time inputs
    setTimeout(() => {
        const fromInput = document.getElementById("rescheduleFromTime");
        const toInput = document.getElementById("rescheduleToTime");
        
        if (fromInput && tempRescheduleFromTime) {
            fromInput.value = tempRescheduleFromTime;
        }
        if (toInput && tempRescheduleToTime) {
            toInput.value = tempRescheduleToTime;
        }
        
        // Also set the student dropdown

/* Optimistic UI Attendance Logging */
function submitQuickAttendance() {
    var finalReason = quickAttendanceState.reason;
    if (quickAttendanceState.reason === "Other") {
        var customNote = document.getElementById("absenceCustomNote");
        if (customNote) {
            var note = customNote.value.trim();
            finalReason = note ? "Other: " + note : "Other";
        }
    }

    var student = (App.students || []).find(function(s) {
        return String(s.studentId) === String(quickAttendanceState.studentId);
    });
    
    var batch = (App.batches || []).find(function(b) {
        return b.batchId === (student ? student.batchId : '');
    });

    var payload = {
        studentId: quickAttendanceState.studentId,
        studentName: student ? student.studentName : quickAttendanceState.studentName,
        batch: batch ? batch.batchName : "Group Class",
        time: student && student.classFromTime ? student.classFromTime + " - " + student.classToTime : "Scheduled",
        date: selectedScheduleDate.toISOString().split('T')[0],
        status: quickAttendanceState.status,
        remarks: quickAttendanceState.status === "Absent" ? (finalReason || "") : ""
    };

    // Immediate Optimistic UI updates
    var previousAttendanceState = App.dayAttendance.slice();
    App.dayAttendance = App.dayAttendance.filter(function(a) {
        return String(a.studentId) !== String(payload.studentId);
    });
    App.dayAttendance.push(payload);

    closePopup();
    showNotification("Logged as " + quickAttendanceState.status + " ✓", "success");
    schedule();

    // Silent Sync to Google Sheets
    google.script.run
        .withSuccessHandler(function(res) {
            if (!res || !res.success) {
                App.dayAttendance = previousAttendanceState;
                showNotification("Sync error: Reverting attendance state.", "error");
                schedule();
            }
        })
        .withFailureHandler(function() {
            App.dayAttendance = previousAttendanceState;
            showNotification("Server error: Reverting attendance state.", "error");
            schedule();
        })
        .recordQuickAttendance(payload);
}

function selectScheduleDate(isoString) {
    // Clear any pending debounce timer
    if (scheduleDebounceTimer) {
        clearTimeout(scheduleDebounceTimer);
        scheduleDebounceTimer = null;
    }

    // Set the new date
    selectedScheduleDate = new Date(isoString);

    // Debounce: wait 150ms before actually loading
    scheduleDebounceTimer = setTimeout(function() {
        // Check if we already have this date's data cached
        if (App._dateCache && App._dateCache[isoString]) {
            // Instant load from cache
            const cached = App._dateCache[isoString];
            App.dayAttendance = cached.attendance || [];
            App.customClasses = cached.customClasses || [];
            renderScheduleView();
            return;
        }

        // Load normally
        schedule();
    }, 150);
}

function resetToTodaySchedule() {
    // Clear any pending debounce
    if (scheduleDebounceTimer) {
        clearTimeout(scheduleDebounceTimer);
        scheduleDebounceTimer = null;
    }

    const todayIso = new Date().toISOString().split('T')[0];
    selectedScheduleDate = new Date();

    // Check cache first
    if (App._dateCache && App._dateCache[todayIso]) {
        const cached = App._dateCache[todayIso];
        App.dayAttendance = cached.attendance || [];
        App.customClasses = cached.customClasses || [];
        renderScheduleView();
        return;
    }

    schedule();
}

function showTimePicker(title, targetInput) {
    // Reset picker state for fresh start
    resetPickerState();
    
    const targetField = document.getElementById(targetInput);
    if (!targetField) {
        console.error("Target field not found:", targetInput);
        return;
    }
    
    // Store which field we're editing
    pickerState.targetInput = targetInput;
    
    // Parse existing value if any
    const currentVal = targetField.value || "";
    
    const parseRegex = /^(0?[1-9]|1[0-2]):([0-5][0-9])\s?(AM|PM)$/i;
    if (parseRegex.test(currentVal)) {
        const matches = currentVal.match(parseRegex);
        pickerState.hour = matches[1].padStart(2, '0');
        pickerState.minute = matches[2];
        pickerState.ampm = matches[3].toUpperCase();
    } else {
        // Default to current time if no valid value
        const now = new Date();
        let hours = now.getHours();
        const ampm = hours >= 12 ? "PM" : "AM";
        hours = hours % 12 || 12;
        pickerState.hour = String(hours).padStart(2, '0');
        pickerState.minute = String(now.getMinutes()).padStart(2, '0');
        pickerState.ampm = ampm;
    }
    
    pickerState.mode = "hour";
    
    renderTimePickerPopup();
}

function commitPickerTime() {
    const formattedResult = `${pickerState.hour}:${pickerState.minute} ${pickerState.ampm}`;
    const target = document.getElementById(pickerState.targetInput);
    
    if(target) {
        target.value = formattedResult;
        
        // Store the value for this specific field
        if (pickerState.targetInput === "rescheduleFromTime" || pickerState.targetInput === "fromTime") {
            tempRescheduleFromTime = formattedResult;
        } else if (pickerState.targetInput === "rescheduleToTime" || pickerState.targetInput === "toTime") {
            tempRescheduleToTime = formattedResult;
        }
        
        // Trigger a change event
        const event = new Event('change', { bubbles: true });
        target.dispatchEvent(event);
        
        // Highlight animation
        target.style.borderColor = "#2563EB";
        target.style.boxShadow = "0 0 0 3px rgba(37,99,235,0.2)";
        setTimeout(() => {
            target.style.borderColor = "#D1D5DB";
            target.style.boxShadow = "none";
        }, 800);
        
        console.log(`Time set for ${pickerState.targetInput}: ${formattedResult}`);
    }
    
    // Reset picker state
    resetPickerState();
    
    // Close ONLY the time picker
    closeTimePicker();
}

function submitCustomScheduleEvent() {
    // Get student from dropdown
    const studentSelect = document.getElementById("modalStudentSelect");
    let studentId = studentSelect ? studentSelect.value : customEventState.studentId;
    
    if (!studentId) {
        showNotification("Please select a student.", "warning");
        return;
    }

    const student = App.students.find(s => String(s.studentId) === String(studentId));
    if (!student) {
        showNotification("Student not found.", "error");
        return;
    }

    const fromInput = document.getElementById("rescheduleFromTime");
    const toInput = document.getElementById("rescheduleToTime");
    const reasonInput = document.getElementById("modalEventReason");
    const dateInput = document.getElementById("modalClassDate");
    
    const newFrom = fromInput ? fromInput.value.trim() : "";
    const newTo = toInput ? toInput.value.trim() : "";
    const reason = reasonInput ? reasonInput.value.trim() : "";
    const classDate = dateInput ? dateInput.value : "";

    if (customEventState.type !== "cancel" && (!newFrom || !newTo)) {
        showNotification("Please set the class time.", "warning");
        return;
    }

    closePopup();

    const type = customEventState.type;

    if (type === "newclass" || type === "makeup") {
        const customClass = {
            studentId: studentId,
            studentName: student.studentName,
            batchId: student.batchId || "",
            batchName: getBatchName(student.batchId) || "Custom Class",
            date: classDate,
            fromTime: newFrom,
            toTime: newTo,
            reason: reason || (type === "makeup" ? "Makeup Class" : "Custom/Extra Class"),
            status: "Scheduled",
            attendanceStatus: "",
            attendanceRemarks: "",
            isCustom: true
        };
        
        const label = type === "makeup" ? "Makeup class" : "New class";
        showNotification(`✅ ${label} added for ${student.studentName} on ${classDate} at ${newFrom} - ${newTo}`, "success");
        
        google.script.run
            .withSuccessHandler(function(response) {
                if (response.success) {
                    if (!App.customClasses) App.customClasses = [];
                    App.customClasses.push(customClass);
                    schedule();
                } else {
                    showNotification("Failed to save. Please try again.", "error");
                }
            })
            .withFailureHandler(function(err) {
                console.error(err);
                showNotification("Failed to save. Please try again.", "error");
            })
            .saveCustomClass(customClass);
            
    } else if (type === "reschedule") {
        student.classFromTime = newFrom;
        student.classToTime = newTo;
        showNotification(`✅ ${student.studentName}'s class rescheduled to ${newFrom} - ${newTo}`, "success");
        
        CacheEngine.save(CacheEngine.KEYS.STUDENTS, App.students);
        schedule();
        
        google.script.run
            .withSuccessHandler(function() {
                console.log("Schedule update synced.");
            })
            .withFailureHandler(function(err) {
                console.error("Failed to sync:", err);
                showNotification("Failed to sync changes. Please try again.", "error");
            })
            .updateStudent(studentId, student);
            
    } else if (type === "cancel") {
        showNotification(`ℹ️ Class for ${student.studentName} cancelled.`, "info");
    }

    // Clear temp values
    tempRescheduleFromTime = "";
    tempRescheduleToTime = "";
}

function updateDateDisplay(dateValue) {
    const display = document.getElementById('dateDisplay');
    if (!display) return;
    if (!dateValue) {
        display.textContent = 'Select a date';
        return;
    }
    const date = new Date(dateValue);
    const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
    const formatted = date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    display.textContent = `${dayName}, ${formatted}`;
}

function switchEventType(type) {
    customEventState.type = type;
    
    // Reset all chips
    const chipIds = ["chipReschedule", "chipCancel", "chipMakeup", "chipNewClass"];
    chipIds.forEach(function(id) {
        const el = document.getElementById(id);
        if (el) {
            el.style.background = "#F8FAFC";
            el.style.color = "#64748B";
        }
    });
    
    // Highlight selected chip
    const chipMap = {
        'reschedule': 'chipReschedule',
        'cancel': 'chipCancel', 
        'makeup': 'chipMakeup',
        'newclass': 'chipNewClass'
    };
    const selectedId = chipMap[type];
    if (selectedId) {
        const el = document.getElementById(selectedId);
        if (el) {
            el.style.background = "#2563EB";
            el.style.color = "white";
        }
    }
    
    // Show/hide time slot
    const timeSlotContainer = document.getElementById("timeSlotContainer");
    if (timeSlotContainer) {
        timeSlotContainer.style.display = (type === "cancel") ? "none" : "block";
    }
    
    // Update button text
    const btn = document.getElementById("btnSubmitCustomEvent");
    if (btn) {
        const textMap = {
            'reschedule': '✅ Save Changes',
            'cancel': '🚫 Cancel Class',
            'makeup': '⭐ Add Makeup',
            'newclass': '➕ Add Class'
        };
        btn.textContent = textMap[type] || 'Save';
    }
}

function fees(studentId = null) {
    const backAction = studentId ? `openStudentById('${studentId}')` : `screen('home')`;

    render(`
        <div class="studentsPage">
            <div class="pageHero">
                <div class="pageTopBar">
                    <span class="material-icons pointer" onclick="${backAction}">arrow_back</span>
                    <div class="pageTitle">${studentId ? 'Student Fees' : 'All Payments'}</div>
                    <span class="material-icons">payments</span>
                </div>
                <div class="pageHeading">${studentId ? 'Student Finance' : 'Transactions'}</div>
            </div>

            <div class="pageContent">
                <div id="feesListContainer" class="contentSpacing" style="padding-bottom: 40px;">
                    <div class="actionCard">Fetching ledger data...</div>
                </div>
            </div>
        </div>
    `);

    google.script.run
        .withSuccessHandler(function(payments) {
            const container = document.getElementById("feesListContainer");
            if (!container) return;

            let filtered = studentId ? payments.filter(p => String(p.studentId) === String(studentId)) : payments;

            if (!filtered || filtered.length === 0) {
                container.innerHTML = `<div class="actionCard" style="text-align:center; color:var(--light);">No transaction history found.</div>`;
                return;
            }

            container.innerHTML = filtered.map((p) => `
                <div class="actionCard" style="padding: 16px;" onclick='showPaymentDetails(${JSON.stringify(p)})'>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div style="flex: 1;">
                            <div class="actionTitle">${p.studentName}</div>
                            <div class="actionSubtitle" style="margin-top: 4px;">${p.feeMonth || 'N/A'} • ${p.date}</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-weight: 700; color: var(--lw-blue);">₹${p.amount}</div>
                            <div style="font-size: 11px; color: var(--light);">${p.mode}</div>
                        </div>
                    </div>
                </div>
            `).join("");
        })
        .withFailureHandler(function() {
            const container = document.getElementById("feesListContainer");
            if (container) container.innerHTML = `<div class="actionCard">Error loading transactions.</div>`;
        })
        .getPayments();

    bottomNavigation(studentId ? "studentProfile" : "fees");
}

function voidTransaction(payment) {
    const doubleCheck = confirm(`Are you absolutely sure you want to void this payment of ₹${payment.amount} for ${payment.studentName}?`);
    if (!doubleCheck) return;

    showNotification("Voiding transaction record...", "info");

    const payload = {
        paymentId: payment.paymentId,
        studentId: payment.studentId,
        date: payment.date,
        amount: payment.amount
    };

    google.script.run
        .withSuccessHandler(function() {
            showNotification("Transaction voided successfully.", "success");
            setTimeout(function() {
                fees((App.navigationState.screen === "studentProfile") ? App.currentStudentId : null);
            }, 800);
        })
        .withFailureHandler(function(err) {
            showNotification(err?.message || "Backend sync failed.", "error");
        })
        .deletePaymentRecord(payload);
}

let PaymentFlow = {
    step: 1,
    studentId: "",
    studentName: "",
    baseFee: 0,
    selectedMonths: [],
    amount: 0,
    mode: "GPay",
    remarks: ""
};

function addPayment() {
    PaymentFlow = { step: 1, studentId: "", studentName: "", baseFee: 0, selectedMonths: [], amount: 0, mode: "GPay", remarks: "" };
    renderPaymentFlowScreen();
}

function renderPaymentFlowScreen() {
    let title = "Record Payment";
    let subTitle = `Step ${PaymentFlow.step} of 4`;
    let bodyContent = "";
    let footerContent = "";

    switch (PaymentFlow.step) {
        case 1:
            title = "Select Student";
            subTitle = "Who is making the payment?";
            bodyContent = `
                <div class="searchContainer" style="margin-bottom: 16px;">
                    <span class="material-icons">search</span>
                    <input id="flowStudentSearch" class="searchInput" type="text" placeholder="Search student name..." onkeyup="filterFlowStudents()">
                </div>
                <div id="flowStudentList" style="max-height: 400px; overflow-y: auto; padding: 2px;">
                    <div class="actionCard">Loading active students...</div>
                </div>
            `;
            break;

        case 2:
            title = "Select Months";
            subTitle = `Select billing timeline for ${PaymentFlow.studentName}`;
            
            let timelineHtml = "";
            let dateObj = new Date();
            
            for (let i = 0; i < 6; i++) {
                let mName = dateObj.toLocaleString('default', { month: 'long', year: 'numeric' });
                let isSelected = PaymentFlow.selectedMonths.includes(mName);
                
                timelineHtml += `
                    <div class="actionCard" 
                         style="display: flex; align-items: center; justify-content: space-between; padding: 18px; margin-bottom: 12px; cursor: pointer; border: 2px solid ${isSelected ? '#16A34A' : '#E5E7EB'}; background: ${isSelected ? '#F0FDF4' : '#FFFFFF'}; border-radius: 12px;"
                         onclick="toggleFlowMonth('${mName}')">
                        <div style="display: flex; align-items: center; gap: 16px;">
                            <span class="material-icons" style="color: ${isSelected ? '#16A34A' : '#9CA3AF'}; font-size: 24px;">
                                ${isSelected ? 'check_circle' : 'radio_button_unchecked'}
                            </span>
                            <div>
                                <div style="font-weight: 700; color: #111827; font-size: 16px;">${mName}</div>
                                <div style="font-size: 13px; color: #6B7280; margin-top: 2px;">Standard Fee: ₹${PaymentFlow.baseFee}</div>
                            </div>
                        </div>
                        <div style="font-size: 16px; font-weight: 700; color: ${isSelected ? '#16A34A' : '#111827'};">
                            ₹${PaymentFlow.baseFee}
                        </div>
                    </div>
                `;
                dateObj.setMonth(dateObj.getMonth() + 1);
            }

            bodyContent = `
                <div style="margin-bottom: 16px; font-size: 14px; font-weight: 700; color: #374151; background: #F3F4F6; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between;">
                    <span>Selected: ${PaymentFlow.selectedMonths.length} Month${PaymentFlow.selectedMonths.length !== 1 ? 's' : ''}</span>
                    <span style="color: #16A34A;">Total: ₹${PaymentFlow.baseFee * PaymentFlow.selectedMonths.length}</span>
                </div>
                <div id="timelineContainer" style="max-height: 380px; overflow-y: auto; padding-right: 4px;">
                    ${timelineHtml}
                </div>
            `;
            
            footerContent = `
                <div style="display: flex; gap: 12px; margin-top: 20px;">
                    <button class="secondaryButton" style="flex: 1;" onclick="changeFlowStep(-1)">Back</button>
                    <button class="primaryButton" style="flex: 1;" id="btnFlowStep2" ${PaymentFlow.selectedMonths.length === 0 ? 'disabled style="opacity:0.5;"' : ''} onclick="changeFlowStep(1)">Next</button>
                </div>
            `;
            break;

        case 3:
            title = "Amount Transacted";
            subTitle = `Expected monthly fee rate: ₹${PaymentFlow.baseFee}`;
            
            let calculatedTotal = PaymentFlow.baseFee * PaymentFlow.selectedMonths.length;
            if (PaymentFlow.amount === 0) PaymentFlow.amount = calculatedTotal;

            bodyContent = `
                <div style="text-align: center; margin: 20px 0;">
                    <div style="font-size: 13px; color: #6B7280; font-weight: 600; text-transform: uppercase;">Confirmed Amount (₹)</div>
                    <input id="flowAmountInput" type="number" value="${PaymentFlow.amount}" 
                           style="width: 80%; border: none; border-bottom: 2px solid var(--lw-blue); text-align: center; font-size: 42px; font-weight: 800; color: #111827; outline: none; padding: 10px 0; background: transparent;" 
                           oninput="PaymentFlow.amount = Number(this.value)">
                    <div style="margin-top: 12px; font-size: 14px; color: #2563EB; font-weight: 600;">
                        Auto-calculated: ₹${calculatedTotal} (${PaymentFlow.selectedMonths.length} Month${PaymentFlow.selectedMonths.length > 1 ? 's' : ''})
                    </div>
                </div>
            `;
            
            footerContent = `
                <div style="display: flex; gap: 12px; margin-top: 20px;">
                    <button class="secondaryButton" style="flex: 1;" onclick="changeFlowStep(-1)">Back</button>
                    <button class="primaryButton" style="flex: 1;" onclick="validateAndGoToStep4()">Next</button>
                </div>
            `;
            break;

        case 4:
            title = "Finalize Payment";
            subTitle = "Choose payment pathway option";
            
            let modes = ["GPay", "Bank Transfer", "Cash"];
            let modeChips = modes.map(m => `
                <div class="timeChip ${PaymentFlow.mode === m ? 'selected' : ''}" 
                     style="padding: 16px; flex: 1; text-align: center; font-weight: 600; font-size: 15px; cursor: pointer;" 
                     onclick="setFlowMode('${m}')">
                    ${m}
                </div>
            `).join("");

            bodyContent = `
                <div class="actionCard" style="background: #F9FAFB; padding: 18px; margin-bottom: 20px; border: 1px dashed #D1D5DB;">
                    <div style="font-size: 14px; color: #4B5563; margin-bottom: 6px;"><b>Summary Review</b></div>
                    <div style="font-size: 16px; color: #111827; font-weight: 600;">${PaymentFlow.studentName}</div>
                    <div style="font-size: 13px; color: #6B7280; margin-top: 2px;">Months: ${PaymentFlow.selectedMonths.join(", ")}</div>
                    <div style="font-size: 18px; color: #16A34A; font-weight: 700; margin-top: 10px;">
                        Total: ₹${PaymentFlow.amount}
                    </div>
                </div>

                <div style="font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 8px;">Payment Mode</div>
                <div style="display: flex; gap: 10px; margin-bottom: 24px;">
                    ${modeChips}
                </div>

                <div class="formGroup">
                    <label>Internal Transaction Memo / Remarks</label>
                    <input id="flowRemarks" class="inputBox" type="text" placeholder="Reference ID, notes, etc." value="${PaymentFlow.remarks}" oninput="PaymentFlow.remarks = this.value">
                </div>
            `;
            
            footerContent = `
                <div style="display: flex; gap: 12px; margin-top: 20px;">
                    <button class="secondaryButton" style="flex: 1;" onclick="changeFlowStep(-1)">Back</button>
                    <button id="btnSubmitFlowPayment" class="primaryButton" style="flex: 1; background: #16A34A;" onclick="processFlowSubmission()">Commit Payment ✓</button>
                </div>
            `;
            break;
    }

    render(`
        <div class="formPage" style="max-width: 500px; margin: 0 auto; padding: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <button class="backButton" style="margin: 0;" onclick="screen('fees')">◀ Cancel</button>
                <div style="font-size: 13px; font-weight: 700; background: #E5E7EB; color: #4B5563; padding: 4px 10px; border-radius: 20px;">${subTitle}</div>
            </div>
            
            <h2 class="pageTitle" style="margin-bottom: 24px; font-size: 28px; font-weight: 800; color: #111827;">${title}</h2>

            <div class="flowBody" style="min-height: 260px;">
                ${bodyContent}
            </div>

            ${footerContent}
        </div>
    `);

    bottomNavigation("fees");

    if (PaymentFlow.step === 1) {
        if (App.students && App.students.length > 0) {
            renderFlowStudentCards(App.students);
        } else {
            google.script.run.withSuccessHandler(function(data) {
                App.students = data || [];
                renderFlowStudentCards(App.students);
            }).getStudents();
        }
    }
}

function renderFlowStudentCards(list) {
    const container = document.getElementById("flowStudentList");
    if (!container) return;

    const activeList = list.filter(s => s.status !== "Inactive");
    if (activeList.length === 0) {
        container.innerHTML = `<div class="actionCard">No matching records found.</div>`;
        return;
    }

    container.innerHTML = activeList.map(student => `
        <div class="actionCard" style="cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; margin-bottom: 8px;" 
             onclick="selectFlowStudent('${student.studentId}', '${student.studentName}', ${student.expectedFee || 0})">
            <div>
                <div style="font-weight: 600; color: #111827; font-size: 16px;">${student.studentName}</div>
                <div style="font-size: 13px; color: #6B7280; margin-top: 2px;">${student.classType || 'Regular'} • ID: ${student.studentId}</div>
            </div>
            <div style="text-align: right;">
                <div style="font-weight: 700; color: var(--lw-blue); font-size: 14px;">₹${student.expectedFee || 0}/mo</div>
                <span class="material-icons" style="font-size: 18px; color: #9CA3AF; margin-top: 4px;">chevron_right</span>
            </div>
        </div>
    `).join("");
}

function filterFlowStudents() {
    const query = (document.getElementById("flowStudentSearch")?.value || "").trim().toLowerCase();
    if (query === "") {
        renderFlowStudentCards(App.students);
        return;
    }
    const filtered = App.students.filter(s => s.studentName.toLowerCase().includes(query) || String(s.studentId).toLowerCase().includes(query));
    renderFlowStudentCards(filtered);
}

function selectFlowStudent(id, name, fee) {
    PaymentFlow.studentId = id;
    PaymentFlow.studentName = name;
    PaymentFlow.baseFee = fee;
    PaymentFlow.step = 2; 
    renderPaymentFlowScreen();
}

function toggleFlowMonth(month) {
    const idx = PaymentFlow.selectedMonths.indexOf(month);
    if (idx > -1) {
        PaymentFlow.selectedMonths.splice(idx, 1);
    } else {
        PaymentFlow.selectedMonths.push(month);
    }
    renderPaymentFlowScreen();
}

function setFlowMode(mode) {
    PaymentFlow.mode = mode;
    renderPaymentFlowScreen();
}

function changeFlowStep(direction) {
    PaymentFlow.step += direction;
    renderPaymentFlowScreen();
}

function validateAndGoToStep4() {
    const calculatedTotal = PaymentFlow.baseFee * PaymentFlow.selectedMonths.length;
    PaymentFlow.amount = calculatedTotal;
    PaymentFlow.step = 4;
    renderPaymentFlowScreen();
}

function processFlowSubmission() {
    if (App.requestInProgress) return;

    const paymentData = {
        date: new Date().toLocaleDateString('en-IN'), 
        studentId: PaymentFlow.studentId,
        studentName: PaymentFlow.studentName,
        monthsCovered: PaymentFlow.selectedMonths,
        amount: PaymentFlow.amount.toString(),
        mode: PaymentFlow.mode,
        remarks: PaymentFlow.remarks
    };

    const button = document.getElementById("btnSubmitFlowPayment");
    App.requestInProgress = true;
    if (button) {
        button.disabled = true;
        button.innerHTML = "Processing Sync...";
    }

    google.script.run
        .withSuccessHandler(function(paymentId) {
            showNotification(`Payment logged cleanly! ID: ${paymentId}`, "success");
            App.requestInProgress = false;

            const student = App.students.find(s => String(s.studentId) === String(PaymentFlow.studentId));

            const receiptData = {
                receiptNo: paymentId || 'LW-' + Math.floor(1000 + Math.random() * 9000),
                studentName: PaymentFlow.studentName,
                parentName: student ? student.parentName : "Parent",
                amount: PaymentFlow.amount,
                date: paymentData.date,
                mode: PaymentFlow.mode,
                notes: PaymentFlow.selectedMonths.length > 0 
                       ? `Paid for ${PaymentFlow.selectedMonths.join(", ")}` 
                       : (PaymentFlow.remarks || "Standard Monthly Fee")
            };

            showReceiptCardPreview(receiptData);
        })
        .withFailureHandler(function() {
            App.requestInProgress = false;
            if (button) {
                button.disabled = false;
                button.innerHTML = "Commit Payment ✓";
            }
            showNotification("Server interface fault.", "error");
        })
        .savePayment(paymentData);
}

/* Digital Receipt Card Renderer & Print Trigger */


// Fixed print function to safely handle print window generation
function printReceipt() {
    const receiptElement = document.getElementById('printableReceipt');
    
    if (!receiptElement) {
        showNotification("Receipt not found.", "error");
        return;
    }

    // Open a new window for printing
    const printWindow = window.open('', '_blank', 'width=500,height=700');
    if (!printWindow) {
        showNotification("Please allow popups for printing.", "warning");
        return;
    }

    // Get all styles from the main document
    const styles = document.querySelector('style')?.innerHTML || '';
    const receiptHtml = receiptElement.outerHTML;

    printWindow.document.write(`
        <!DOCTYPE html>
        <html>
            <head>
                <title>Receipt - Language Wonder</title>
                <style>
                    /* Copy all existing styles */
                    ${styles}
                    
                    /* Print-specific overrides */
                    body { 
                        padding: 20px; 
                        background: #ffffff; 
                        margin: 0; 
                        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                    }
                    
                    #printableReceipt { 
                        max-width: 440px; 
                        margin: 0 auto; 
                        border: 1px solid #E2E8F0; 
                        border-radius: 24px; 
                        padding: 24px; 
                        background: #ffffff;
                        box-shadow: none;
                    }
                    
                    .material-icons {
                        font-family: 'Material Icons';
                        font-weight: normal;
                        font-style: normal;
                        font-size: 24px;
                        line-height: 1;
                        letter-spacing: normal;
                        text-transform: none;
                        display: inline-block;
                        white-space: nowrap;
                        word-wrap: normal;
                        direction: ltr;
                        -webkit-font-smoothing: antialiased;
                    }
                    
                    @media print {
                        body { 
                            padding: 0; 
                            background: #ffffff;
                        }
                        #printableReceipt {
                            border: none;
                            border-radius: 0;
                            padding: 20px;
                            box-shadow: none;
                        }
                        .no-print { 
                            display: none !important; 
                        }
                    }
                </style>
                <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
            </head>
            <body>
                ${receiptHtml}
                <div style="text-align:center; margin-top:20px; font-size:12px; color:#94A3B8;" class="no-print">
                    Generated by Language Wonder Academy Suite
                </div>
            </body>
        </html>
    `);
    printWindow.document.close();
    
    // Wait for content to load then print
    setTimeout(function() {
        printWindow.focus();
        printWindow.print();
        setTimeout(function() {
            printWindow.close();
        }, 500);
    }, 500);
}

function showReceiptCardPreview(data) {

function getPaymentStatus(paidUntilDate) {
    if (!paidUntilDate || paidUntilDate === "") return { label: "Pending", color: "#F59E0B" };
    
    const parts = paidUntilDate.split(" ");
    if (parts.length < 2) return { label: "Pending", color: "#F59E0B" };

    const monthName = parts[0];
    const year = parseInt(parts[1]);
    
    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const monthIndex = months.indexOf(monthName);
    
    const now = new Date();
    const currentMonth = now.getMonth();
    const currentYear = now.getFullYear();

    if (year > currentYear || (year === currentYear && monthIndex >= currentMonth)) {
        return { label: "Paid", color: "#16A34A" };
    }
    
    return { label: "Pending", color: "#F59E0B" };
}
